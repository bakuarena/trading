<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepHat Terminal</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Lightweight Charts by TradingView -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header / Ticker Tape -->
        <header class="ticker-wrap">
            <div class="ticker-content" id="tickerContent">
                <!-- Injected via JS -->
            </div>
        </header>

        <div class="main-layout">
            <!-- Sidebar: Watchlist -->
            <aside class="sidebar">
                <div class="panel-header">Watchlist</div>
                <div class="watchlist" id="watchlist">
                    <!-- Assets injected via JS -->
                </div>
            </aside>

            <!-- Main Chart Area -->
            <main class="chart-area">
                <div class="chart-header">
                    <h2 id="activeAssetName">BTC/USD</h2>
                    <div class="price-display">
                        <span id="activeAssetPrice" class="large-price">$0.00</span>
                        <span id="activeAssetChange" class="price-change">0.00%</span>
                    </div>
                </div>
                <div id="mainChart"></div>
            </main>

            <!-- Right Panel: Trading & Portfolio -->
            <aside class="trading-panel">
                <div class="portfolio-summary">
                    <div class="summary-item">
                        <span>Cash Balance</span>
                        <span id="cashBalance" class="highlight">$10,000.00</span>
                    </div>
                    <div class="summary-item">
                        <span>Portfolio Value</span>
                        <span id="portfolioValue" class="highlight">$10,000.00</span>
                    </div>
                </div>

                <div class="order-entry">
                    <div class="tabs">
                        <button id="buyTab" class="tab active">Buy</button>
                        <button id="sellTab" class="tab">Sell</button>
                    </div>
                    <div class="input-group">
                        <label>Amount (USD)</label>
                        <input type="number" id="tradeAmount" value="100" min="1" step="1">
                    </div>
                    <div class="input-group">
                        <label>Price (Limit/Mkt)</label>
                        <input type="number" id="tradePrice" value="0" min="0" step="0.01" readonly>
                    </div>
                    <div class="trade-stats">
                        <div>Est. Quantity: <span id="estQty">0</span></div>
                        <div>Est. Fees: <span id="estFees">$0.00</span></div>
                    </div>
                    <button id="executeTrade" class="btn-trade">Buy BTC</button>
                </div>

                <div class="positions">
                    <div class="panel-header">Open Positions</div>
                    <div id="positionsList">
                        <p class="empty-state">No open positions</p>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
